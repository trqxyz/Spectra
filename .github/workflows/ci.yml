name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 21 ]

    steps:
      - uses: actions/checkout@v4

      # Both JDKs are installed: the daemon runs on the matrix version,
      # while Gradle's toolchain still finds 21 to compile with.
      - name: Set up JDK ${{ matrix.java }} and 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew is committed without the executable bit, so Linux needs this.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check code style
        run: ./gradlew spotlessCheck

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Run tests
        run: ./gradlew test

      - name: Run container-backed tests
        if: matrix.java == 21
        run: ./gradlew --no-daemon containerTest

      - name: Build shadow JAR
        run: ./gradlew shadowJar

      - name: Resolve shadow JAR path
        id: jar
        run: echo "path=$(./gradlew -q printShadowJarPath)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spectra-java${{ matrix.java }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error
