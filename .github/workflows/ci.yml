name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 21 ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check code style
        if: matrix.java == 17
        run: ./gradlew spotlessCheck

      - name: Run Detekt
        run: ./gradlew detekt -PjavaTarget=${{ matrix.java }}

      - name: Run tests
        run: ./gradlew test -PjavaTarget=${{ matrix.java }}

      - name: Run container-backed tests
        if: matrix.java == 21
        run: ./gradlew --no-daemon containerTest -PjavaTarget=${{ matrix.java }}

      - name: Package release assets
        run: |
          set -euo pipefail
          version="$(./gradlew -q properties | awk '/^version:/ {print $2}')"
          ./gradlew shadowJar -PjavaTarget=${{ matrix.java }}
          shaded="$(./gradlew -q printShadowJarPath -PjavaTarget=${{ matrix.java }})"
          ./gradlew shadowJar -PjavaTarget=${{ matrix.java }} -PshadePE=false
          unbundled="$(./gradlew -q printShadowJarPath -PjavaTarget=${{ matrix.java }} -PshadePE=false)"
          mkdir -p release
          cp "$shaded" "$unbundled" release/
          printf '%s' "$version" > release/VERSION
          ls -l release

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-java${{ matrix.java }}
          path: release/
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download the JARs built by the matrix
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-java*
          merge-multiple: true
          path: release

      - name: Collect release metadata
        id: meta
        run: |
          set -euo pipefail
          echo "version=$(cat release/VERSION)" >> "$GITHUB_OUTPUT"
          rm release/VERSION
          echo "subject=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<SPECTRA_EOF'
            git log -1 --pretty=%B
            echo 'SPECTRA_EOF'
          } >> "$GITHUB_OUTPUT"
          ls -l release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}-${{ github.run_number }}
          name: ${{ steps.meta.outputs.subject }}
          body: ${{ steps.meta.outputs.body }}
          files: release/*.jar
