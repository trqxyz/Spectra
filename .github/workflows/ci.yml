name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 21 ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }} and 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check code style
        run: ./gradlew spotlessCheck

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Run tests
        run: ./gradlew test

      - name: Run container-backed tests
        if: matrix.java == 21
        run: ./gradlew --no-daemon containerTest

      - name: Build shadow JAR
        run: ./gradlew shadowJar

      - name: Package release assets
        if: matrix.java == 21
        run: |
          set -euo pipefail
          version="$(./gradlew -q properties | awk '/^version:/ {print $2}')"
          shaded="$(./gradlew -q printShadowJarPath)"
          ./gradlew shadowJar -PshadePE=false
          unbundled="$(./gradlew -q printShadowJarPath -PshadePE=false)"
          mkdir -p release
          cp "$shaded"    "release/Spectra-${version}-java17.jar"
          cp "$unbundled" "release/Spectra-${version}-java17-unbundled.jar"
          printf '%s' "$version" > release/VERSION
          ls -l release

      - name: Upload release assets
        if: matrix.java == 21
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download the JARs built by the matrix
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release

      - name: Collect release metadata
        id: meta
        run: |
          set -euo pipefail
          echo "version=$(cat release/VERSION)" >> "$GITHUB_OUTPUT"
          rm release/VERSION
          echo "subject=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<SPECTRA_EOF'
            git log -1 --pretty=%B
            echo 'SPECTRA_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}-${{ github.run_number }}
          name: ${{ steps.meta.outputs.subject }}
          body: ${{ steps.meta.outputs.body }}
          files: release/*.jar
