name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    steps:
      # workflow_run стартует от ветки, поэтому явно берём коммит, который собрал CI.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build shaded JAR
        run: ./gradlew shadowJar

      - name: Resolve shaded JAR path
        id: shaded
        run: echo "path=$(./gradlew -q printShadowJarPath)" >> "$GITHUB_OUTPUT"

      - name: Build unbundled JAR
        run: ./gradlew shadowJar -PshadePE=false

      - name: Resolve unbundled JAR path
        id: unbundled
        run: echo "path=$(./gradlew -q printShadowJarPath -PshadePE=false)" >> "$GITHUB_OUTPUT"

      - name: Generate tag
        id: tag
        run: echo "tag=v$(date -u +%Y.%m.%d)-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: |
            Automatic release from commit ${{ github.event.workflow_run.head_sha || github.sha }}.
          files: |
            ${{ steps.shaded.outputs.path }}
            ${{ steps.unbundled.outputs.path }}
